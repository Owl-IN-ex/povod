name: Patch chart palette

on:
  push:
    paths:
      - '.github/workflows/patch-chart-palette.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 .github/patch_chart.py
      - name: Commit update
        run: |
          rm .github/workflows/patch-chart-palette.yml .github/patch_chart.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-chart-palette.yml .github/patch_chart.py
          git commit -m "fix: improve expense chart contrast (0.10.2 beta)"
          git push origin main
